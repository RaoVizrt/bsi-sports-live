<div class="dashboard-container">
  <header class="dashboard-header">
    <h2>BSI Sports Live - Dashboard</h2>
    <button (click)="logout()" class="btn-logout">Logout</button>
  </header>

  <main class="dashboard-content">
    <div class="welcome-card">
      <h3>Welcome, {{ username }}!</h3>
      <p>Manage your sports tournaments, teams, and live score settings from here.</p>
    </div>

    <div class="cards-grid">
      <!-- Tournaments Card -->
      <a routerLink="/tournaments" class="nav-card">
        <h4>Tournaments</h4>
        <p>View, create, and manage your tournaments.</p>
      </a>

      <!-- Teams & Players Card -->
      <div class="nav-card disabled">
        <h4>Teams & Players</h4>
        <p>Coming soon...</p>
      </div>
    </div>
  </main>
</div>
